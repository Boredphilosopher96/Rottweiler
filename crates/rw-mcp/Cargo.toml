[package]
name = "rw-mcp"
description = "MCP client and server integration for Rottweiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.89"
base64.workspace = true
http.workspace = true
blake3.workspace = true
futures-util = "0.3.31"
getrandom.workspace = true
rmcp.workspace = true
rw-resources.workspace = true
rw-store.workspace = true
rw-tools.workspace = true
rw-types.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.23"
tiktoken-rs = "0.12.0"

[features]
default = []
test-support = []

[[bin]]
name = "rw-mcp-fixture"
path = "src/bin/rw-mcp-fixture.rs"
test = false
doc = false
required-features = ["test-support"]

[[test]]
name = "three_process_cold_start"
path = "tests/three_process_cold_start.rs"
required-features = ["test-support"]

[[test]]
name = "five_process_deferred_acceptance"
path = "tests/five_process_deferred_acceptance.rs"
required-features = ["test-support"]

[lints]
workspace = true
