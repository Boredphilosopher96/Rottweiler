[package]
name = "rw-sandbox"
description = "OS-native process sandboxing for Rottweiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[test]]
name = "linux_helper_driver"
path = "tests/linux_helper_driver.rs"
harness = false

[dependencies]
base64.workspace = true
rw-types.workspace = true
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3.23"
url.workspace = true
webpki-roots = "1.0.8"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.5"
libc = "0.2.183"
nix = { workspace = true, features = ["fs", "socket"] }
# nix 0.31 intentionally requires an `AsFd` for `fcntl`, but the Linux
# sandbox helper receives a validated inherited descriptor number. Keep the
# already-transitive 0.28 API as a narrow, safe raw-descriptor bridge so the
# workspace can continue to forbid unsafe code.
nix-raw-fd = { package = "nix", version = "0.28.0", default-features = false, features = ["fs"] }
rustix.workspace = true
seccompiler = "0.5.0"

[dev-dependencies]
tempfile = "3.23"
tokio.workspace = true

[lints]
workspace = true
