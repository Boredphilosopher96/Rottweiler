[package]
name = "rw-wasm-host"
description = "Private capability-bounded WASM helper for Rottweiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rottweiler-wasm-host"
path = "src/main.rs"

[dependencies]
rw-ext = { workspace = true, features = ["wasm-runtime"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
wat = "1.251.0"

[lints]
workspace = true
