version = 1

# This manifest registers boundaries that have a mechanical ownership check.
# It does not claim that unregistered behavior has been audited or consolidated.

[[owner]]
id = "release-distribution-contract"
path = "contracts/release-contract.json"
symbols = ["schema_version", "archive", "platforms"]

