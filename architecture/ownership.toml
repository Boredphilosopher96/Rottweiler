[[generator]]
id = "release-contract-rust"
owner = "release-distribution-contract"
command = "python3 scripts/release_contract.py generate-rust --check"
marker = "// @generated by scripts/release_contract.py; do not edit."
outputs = ["crates/rw-types/src/generated/release_contract.rs"]

[[generator]]
id = "release-contract-typescript"
owner = "release-distribution-contract"
command = "python3 scripts/release_contract.py generate-typescript --check"
marker = "// @generated TypeScript projection by scripts/release_contract.py; do not edit."
outputs = ["packages/tui/generated/release-contract.ts"]

[[generator]]
id = "client-protocol-typescript"
owners = [
  "client-protocol-contract",
  "attachment-contract",
  "mcp-server-id-contract",
  "permission-mode-contract",
  "configuration-contracts",
]
command = "cargo run --locked --quiet -p xtask -- codegen --check"
marker = "// @generated by `cargo xtask codegen`; do not edit by hand."
outputs = ["protocol/types.ts", "protocol/fixtures/contract.ts"]

[[generator]]
id = "plugin-protocol-current"
owner = "plugin-wire-contract"
command = "cargo run --locked --quiet -p rw-plugin-protocol --bin rw-plugin-protocol-codegen -- --check"
marker = "@generated by rw-plugin-protocol-codegen; do not edit by hand."
outputs = [
  "packages/plugin-sdk/src/generated/protocol-3.ts",
  "packages/plugin-sdk/fixtures/wire/protocol-3.json",
  "packages/plugin-sdk/fixtures/wire/protocol-3.schema.json",
]

[[shadow]]
id = "duplicate-rw-ext-plugin-wire-owner"
owner = "plugin-wire-contract"
path = "crates/rw-ext/src/plugin.rs"
pattern = '''(?:\bpub\s+use\s+rw_plugin_protocol|\bpub\s+const\s+(?:PROTOCOL_VERSION|METHOD_INITIALIZE|MAX_FRAME_BYTES)\b|\bpub\s+(?:struct|enum)\s+(?:RpcFrame|PluginManifest)\b)'''
reason = "rw-ext imports the leaf contract directly and owns only runtime conversions and enforcement."

[[shadow]]
id = "duplicate-plugin-runtime-catalog-dto"
owner = "plugin-wire-contract"
path = "crates/rw-ext/src/plugin_runtime.rs"
pattern = '''\bstruct\s+(?:RpcProviderModelsResponse|RpcProviderModel|ProviderHttpCapabilityParams)\b'''
reason = "The runtime deserializes protocol-3 catalog and HTTP requests through leaf-owned DTOs."

[[shadow]]
id = "duplicate-plugin-sdk-protocol-owner"
owner = "plugin-wire-contract"
path = "packages/plugin-sdk/src/protocol.ts"
pattern = '''\b(?:export|import)\b'''
allow_missing = true
reason = "The removed SDK shim must not be recreated; SDK modules import the generated contract directly."

