[workspace]
members = [
    "crates/rw-cli",
    "crates/rw-context",
    "crates/rw-core",
    "crates/rw-ext",
    "crates/rw-intel",
    "crates/rw-mcp",
    "crates/rw-providers",
    "crates/rw-sandbox",
    "crates/rw-store",
    "crates/rw-tools",
    "crates/rw-types",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "warn"
unwrap_used = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[workspace.dependencies]
base64 = "0.22.1"
blake3 = "1.8.2"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "server", "tokio"] }
keyring = "4.1.4"
miette = { version = "7.6", features = ["fancy"] }
nix = { version = "0.28.0", features = ["poll"] }
portable-pty = "0.9.0"
rpassword = "=7.5.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "process", "termios"] }
schemars = { version = "1.2.1", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
url = "2.5"

rw-context = { version = "0.1.0", path = "crates/rw-context" }
rw-core = { version = "0.1.0", path = "crates/rw-core" }
rw-ext = { version = "0.1.0", path = "crates/rw-ext" }
rw-intel = { version = "0.1.0", path = "crates/rw-intel" }
rw-mcp = { version = "0.1.0", path = "crates/rw-mcp" }
rw-providers = { version = "0.1.0", path = "crates/rw-providers" }
rw-sandbox = { version = "0.1.0", path = "crates/rw-sandbox" }
rw-store = { version = "0.1.0", path = "crates/rw-store" }
rw-tools = { version = "0.1.0", path = "crates/rw-tools" }
rw-types = { version = "0.1.0", path = "crates/rw-types" }
