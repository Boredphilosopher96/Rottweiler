name: CI

on:
  workflow_dispatch:
    inputs:
      run_performance:
        description: Run non-deterministic performance budgets
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
      - run: rustup override set 1.94.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Install integration test dependencies
        shell: bash
        run: |
          bun install --cwd packages/plugin-sdk --frozen-lockfile
          bun install --cwd packages/tui --frozen-lockfile
      - run: cargo test --locked --workspace --all-features
      - run: cargo run --locked --quiet -p xtask -- codegen --check
      - run: python3 scripts/check-dependency-direction.py
      - run: python3 scripts/check-network-boundaries.py
      - name: Capability-eval adapter contract
        run: |
          python3 -m py_compile evals/harbor/rottweiler_agent.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          bash -n scripts/run-terminal-bench.sh
          test "$(grep -c '^terminal-bench/[a-z0-9-][a-z0-9-]*$' evals/terminal-bench-20.txt)" -eq 20
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: bun run typecheck
        working-directory: packages/plugin-sdk
      - run: bun test
        working-directory: packages/plugin-sdk
      - run: bun run build
        working-directory: packages/plugin-sdk
      - run: bun test
        working-directory: packages/plugin-docs
      - run: bun run build
        working-directory: packages/plugin-docs
      - name: Generated TypeScript plugin scaffold conformance
        shell: bash
        run: |
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          cargo run --locked --quiet -p rw-cli -- plugin scaffold --lang ts --name ci-fixture "$root/plugin"
          SCAFFOLD="$root/plugin" SDK="$GITHUB_WORKSPACE/packages/plugin-sdk" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["SCAFFOLD"]) / "package.json"
          package = json.loads(path.read_text(encoding="utf-8"))
          package["dependencies"]["@rottweiler/plugin"] = f"file:{os.environ['SDK']}"
          path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PY
          bun install --cwd "$root/plugin"
          bun run --cwd "$root/plugin" typecheck
          bun test --cwd "$root/plugin"
          bun run --cwd "$root/plugin" build
      - run: bun run test
        working-directory: packages/tui
      - run: bun run typecheck
        working-directory: packages/tui
      - run: bun run build
        working-directory: packages/tui

  security-tests:
    name: M5 Linux sandbox security acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: crates/rw-sandbox/tests/linux_security_gate.sh
      - name: M8 production-composition functional acceptance
        run: crates/rw-cli/tests/m8_release_gate_linux.sh
        env:
          ROTTWEILER_M8_FUNCTIONAL_ONLY: 1
          ROTTWEILER_M8_PERF_SAMPLES: 1

  performance-smoke:
    name: Per-PR performance smoke
    needs: [test, security-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - name: Enforce headless absolute budgets with a bounded smoke sample
        run: crates/rw-cli/tests/perf_gate.sh
        env:
          ROTTWEILER_PERF_SMOKE: 1
          ROTTWEILER_PERF_SAMPLES: 100
      - name: Enforce TUI transport and render-loop budgets
        run: bun run test:perf
        working-directory: packages/tui

  macos-performance-build:
    name: Build isolated macOS performance binary
    if: github.event_name == 'workflow_dispatch' && inputs.run_performance
    needs: [test, security-tests, performance-smoke]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - name: Build performance binary outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/rottweiler-macos-performance-build.noindex"
          artifact_root="$RUNNER_TEMP/rottweiler-macos-performance-artifact.noindex"
          rm -rf "$build_root" "$artifact_root"
          mkdir -p "$build_root" "$artifact_root"
          CARGO_TARGET_DIR="$build_root" scripts/cargo-release.sh build --locked --release -p rw-cli
          release_dir=$(CARGO_TARGET_DIR="$build_root" scripts/cargo-release.sh artifact-dir)
          install -m 700 "$release_dir/rw" "$artifact_root/rw"
          (cd "$artifact_root" && shasum -a 256 rw > rw.sha256)
      - name: Upload isolated macOS performance binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-performance-rw-${{ github.run_id }}
          path: ${{ runner.temp }}/rottweiler-macos-performance-artifact.noindex
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  performance:
    name: Performance budgets (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_performance
    needs: [test, security-tests, macos-performance-build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x86_64
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: mkdir -p perf-results
      - name: Download isolated macOS performance binary
        if: runner.os == 'macOS'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: macos-performance-rw-${{ github.run_id }}
          path: ${{ runner.temp }}/rottweiler-macos-performance-download.noindex
      - name: Verify isolated macOS performance binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rottweiler-macos-performance-download.noindex"
          shasum -a 256 -c rw.sha256
          chmod 700 rw
      - name: Headless performance gate (macOS prebuilt binary)
        if: runner.os == 'macOS'
        run: crates/rw-cli/tests/perf_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/headless.json
          ROTTWEILER_PERF_SAMPLES: 500
          ROTTWEILER_PERF_PREBUILT_RW: ${{ runner.temp }}/rottweiler-macos-performance-download.noindex/rw
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - name: Headless performance gate (Linux source build)
        if: runner.os == 'Linux'
        run: crates/rw-cli/tests/perf_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/headless.json
          ROTTWEILER_PERF_SAMPLES: 500
      - run: crates/rw-cli/tests/m4_release_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m4.json
      - name: M8 production-composition performance gate (Linux)
        if: runner.os == 'Linux'
        run: crates/rw-cli/tests/m8_release_gate_linux.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m8.json
      - name: M8 production-composition performance gate (macOS)
        if: runner.os != 'Linux'
        run: crates/rw-cli/tests/m8_release_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m8.json
      - run: bun run test:perf
        working-directory: packages/tui
        env:
          ROTTWEILER_PERF_OUTPUT: ${{ github.workspace }}/perf-results/tui.json
      - run: scripts/build-release.sh
      - name: Enforce platform baseline or reviewed PR waiver
        run: >-
          python3 scripts/check-perf-baseline.py
          --baseline benchmarks/performance-baseline.json
          --platform "${{ matrix.platform }}"
          --suite core
          --measurement perf-results/headless.json
          --measurement perf-results/m4.json
          --measurement perf-results/m8.json
          --measurement perf-results/tui.json
          --github-event "$GITHUB_EVENT_PATH"
          --output perf-results/baseline-result.json
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-performance-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-results
          if-no-files-found: warn
          retention-days: 30

  m4-ssh-loopback:
    name: M4 SSH loopback contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
      ROTTWEILER_M4_SKIP_PERFORMANCE: 1
      ROTTWEILER_M4_SKIP_SUPERVISOR: 1
      ROTTWEILER_M4_SKIP_SHELL: 1
      ROTTWEILER_M4_SSH_LOOPBACK_HOST: rottweiler-ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - name: Configure required SSH loopback
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server
          install -d -m 700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          cp "$HOME/.ssh/id_ed25519.pub" "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          cat >> "$HOME/.ssh/config" <<EOF
          Host rottweiler-ci
            HostName 127.0.0.1
            User $USER
            IdentityFile $HOME/.ssh/id_ed25519
            BatchMode yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 "$HOME/.ssh/config"
          sudo install -d -m 755 /run/sshd
          sudo service ssh restart
          ssh rottweiler-ci true
      - run: crates/rw-cli/tests/m4_release_gate.sh

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"
      - name: Cache supply-chain tools
        id: supply-chain-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-audit-0.22.1-cargo-deny-0.19.1
      - name: Install supply-chain tools
        if: steps.supply-chain-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.19.1
      - run: cargo deny check
      - run: cargo audit
