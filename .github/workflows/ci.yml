name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
      - run: rustup override set 1.94.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: M8 production-composition functional acceptance (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p rw-cli --bin rw -p rw-mcp --features rw-mcp/test-support --bin rw-mcp-fixture
          python3 crates/rw-cli/tests/m8_release_gate.py --rw target/debug/rw --fixture target/debug/rw-mcp-fixture --samples 1 --functional-only
      - run: cargo run --locked --quiet -p xtask -- codegen --check
      - run: python3 scripts/check-dependency-direction.py
      - run: python3 scripts/check-network-boundaries.py
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: bun install --frozen-lockfile
        working-directory: packages/plugin-sdk
      - run: bun run typecheck
        working-directory: packages/plugin-sdk
      - run: bun test
        working-directory: packages/plugin-sdk
      - run: bun run build
        working-directory: packages/plugin-sdk
      - name: Generated TypeScript plugin scaffold conformance
        shell: bash
        run: |
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          cargo run --locked --quiet -p rw-cli -- plugin scaffold --lang ts --name ci-fixture "$root/plugin"
          SCAFFOLD="$root/plugin" SDK="$GITHUB_WORKSPACE/packages/plugin-sdk" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["SCAFFOLD"]) / "package.json"
          package = json.loads(path.read_text(encoding="utf-8"))
          package["dependencies"]["@rottweiler/plugin"] = f"file:{os.environ['SDK']}"
          path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PY
          bun install --cwd "$root/plugin"
          bun run --cwd "$root/plugin" typecheck
          bun test --cwd "$root/plugin"
          bun run --cwd "$root/plugin" build
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - run: bun test
        working-directory: packages/tui
      - run: bun run typecheck
        working-directory: packages/tui
      - run: bun run build
        working-directory: packages/tui

  security-tests:
    name: M5 Linux sandbox security acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: crates/rw-sandbox/tests/linux_security_gate.sh

  performance:
    name: M2, M4, and M8 performance budgets
    runs-on: macos-15
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - run: crates/rw-cli/tests/perf_gate.sh
      - run: crates/rw-cli/tests/m4_release_gate.sh
      - run: crates/rw-cli/tests/m8_release_gate.sh
      - run: scripts/build-release.sh

  m4-ssh-loopback:
    name: M4 SSH loopback contract
    runs-on: ubuntu-latest
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
      ROTTWEILER_M4_SKIP_PERFORMANCE: 1
      ROTTWEILER_M4_SKIP_SUPERVISOR: 1
      ROTTWEILER_M4_SKIP_SHELL: 1
      ROTTWEILER_M4_SSH_LOOPBACK_HOST: rottweiler-ci
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - name: Configure required SSH loopback
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server
          install -d -m 700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          cp "$HOME/.ssh/id_ed25519.pub" "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          cat >> "$HOME/.ssh/config" <<EOF
          Host rottweiler-ci
            HostName 127.0.0.1
            User $USER
            IdentityFile $HOME/.ssh/id_ed25519
            BatchMode yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 "$HOME/.ssh/config"
          sudo install -d -m 755 /run/sshd
          sudo service ssh restart
          ssh rottweiler-ci true
      - run: crates/rw-cli/tests/m4_release_gate.sh

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - name: Install supply-chain tools
        run: |
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.19.1
      - run: cargo deny check
      - run: cargo audit
