name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
      - run: rustup override set 1.94.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo run --locked --quiet -p xtask -- codegen --check
      - run: python3 scripts/check-dependency-direction.py
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - run: bun test
        working-directory: packages/tui
      - run: bun run typecheck
        working-directory: packages/tui
      - run: bun run build
        working-directory: packages/tui

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - name: Install supply-chain tools
        run: |
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.19.1
      - run: cargo deny check
      - run: cargo audit
