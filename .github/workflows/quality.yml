name: Risk-focused quality

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: read

concurrency:
  group: risk-focused-quality
  cancel-in-progress: true

jobs:
  rust-coverage:
    name: Rust coverage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust coverage toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview,rustfmt,clippy
          rustup override set 1.97.1
          cargo install --locked cargo-llvm-cov --version 0.8.7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install integration test dependencies
        run: |
          python3 scripts/ci_inventory.py install js-host --build-dependencies
      - name: Prepare Linux sandbox namespace prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iproute2 util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          timeout 10s unshare --user --map-root-user --mount --net --pid --fork /bin/true
          echo "ROTTWEILER_REQUIRE_LINUX_SANDBOX=1" >> "$GITHUB_ENV"
      - name: Build native sandbox test prerequisite
        run: python3 scripts/build-test-helper.py --github-env "$GITHUB_ENV"
      - name: Measure workspace coverage
        run: >-
          cargo llvm-cov
          --locked
          --workspace
          --all-features
          --lcov
          --output-path coverage.lcov
      - name: Write coverage summary
        run: cargo llvm-cov report --summary-only | tee coverage-summary.txt
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.lcov
            coverage-summary.txt
          if-no-files-found: warn
          retention-days: 30

  security-mutation:
    name: Mutation ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: permission
            file: crates/rw-core/src/permission.rs
            filter: 'PermissionGate::(authorize_in_mode|decision_for|auto_safe_decision)|requires_interactive_approval|rememberable_request|rule_decision|unsandboxed_rule_decision|capability_rule_decision'
            test_filter: 'permission::'
            minimum_score: 50
          - name: trust
            file: crates/rw-store/src/trust.rs
            filter: 'FolderTrustStore::(assess|grant|grant_all|revoke|revoke_all|read_ledger|write_ledger)|executable_inventory|inventory_diff'
            test_filter: 'trust::'
            minimum_score: 50
          - name: update
            file: crates/rw-core/src/update.rs
            filter: 'verify_update_metadata|verify_update_metadata_chain|restore_trusted_root_chain|accept_root|verify_envelope|select_role_keys|validate_target'
            test_filter: 'update::'
            minimum_score: 50
          - name: plugin-capabilities
            file: crates/rw-ext/src/plugin.rs
            filter: 'PluginManifest::validate|approval_requirement|approve_manifest|CapabilityEnforcer::(check_tool|check_command|check_hook|check_provider|check_event|check_push|check_push_method|check)'
            test_filter: 'plugin'
            minimum_score: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned mutation toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1
          cargo install --locked cargo-mutants --version 27.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install integration test dependencies
        run: |
          python3 scripts/ci_inventory.py install js-host --build-dependencies
      - name: Prepare Linux sandbox namespace prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iproute2 util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          timeout 10s unshare --user --map-root-user --mount --net --pid --fork /bin/true
          echo "ROTTWEILER_REQUIRE_LINUX_SANDBOX=1" >> "$GITHUB_ENV"
      - name: Build native sandbox test prerequisite
        run: python3 scripts/build-test-helper.py --github-env "$GITHUB_ENV"
      - name: Require tests to catch security-boundary mutations
        continue-on-error: true
        run: >-
          cargo mutants
          --file "${{ matrix.file }}"
          --re "${{ matrix.filter }}"
          --jobs 2
          --timeout 300
          --cargo-arg=--locked
          --cargo-test-arg="${{ matrix.test_filter }}"
      - name: Enforce mutation score floor
        run: >-
          python3 scripts/check-mutation-score.py
          mutants.out/outcomes.json
          --minimum-score "${{ matrix.minimum_score }}"
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutants.out
          if-no-files-found: warn
          retention-days: 30
