name: Plugin SDK release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag (for example, v0.1.5)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-sdk-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact-tag TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate exact tag and published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must be a versioned release tag such as v0.1.5" >&2
            exit 1
          fi
          tag_document="$RUNNER_TEMP/plugin-sdk-tag.json"
          release_document="$RUNNER_TEMP/plugin-sdk-release.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$tag_document"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release_document"
          jq -e --arg tag "refs/tags/$RELEASE_TAG" '.ref == $tag' "$tag_document" >/dev/null
          jq -e --arg tag "$RELEASE_TAG" '
            .tag_name == $tag and
            .draft == false and
            (.published_at | type == "string" and length > 0)
          ' "$release_document" >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - name: Validate checked-out source and package versions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          version=${RELEASE_TAG#v}
          workspace_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          sdk_version=$(python3 -c 'import json; print(json.load(open("packages/plugin-sdk/package.json"))["version"])')
          test "$version" = "$workspace_version"
          test "$version" = "$sdk_version"
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.5.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Publish and consume the exact plugin SDK
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          bun install --cwd packages/plugin-sdk --frozen-lockfile
          bun run --cwd packages/plugin-sdk typecheck
          bun test --cwd packages/plugin-sdk
          bun run --cwd packages/plugin-sdk build
          candidate_root=$(mktemp -d "$RUNNER_TEMP/rottweiler-sdk-candidate.XXXXXX")
          trap 'rm -rf "$candidate_root"' EXIT
          mkdir "$candidate_root/candidate" "$candidate_root/registry"
          candidate=$(cd packages/plugin-sdk && npm pack --silent --pack-destination "$candidate_root/candidate")
          candidate="$candidate_root/candidate/$candidate"
          test -s "$candidate"
          if ! npm view "@rottweiler/plugin@$version" version >/dev/null 2>&1; then
            npm publish --access public packages/plugin-sdk
          fi
          for attempt in $(seq 1 30); do
            if npm view "@rottweiler/plugin@$version" version >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 30
            sleep 2
          done
          observed_version=$(npm view "@rottweiler/plugin@$version" version)
          test "$observed_version" = "$version"
          observed=$(npm pack --silent "@rottweiler/plugin@$version" --pack-destination "$candidate_root/registry")
          cmp "$candidate" "$candidate_root/registry/$observed"
          scaffold="$candidate_root/scaffold"
          cargo run --locked --quiet -p rw-cli -- plugin scaffold --lang ts --name release-smoke "$scaffold"
          bun install --cwd "$scaffold"
          bun run --cwd "$scaffold" typecheck
          bun test --cwd "$scaffold"
          bun run --cwd "$scaffold" build
          test -s "$scaffold/manifest.json"
          rm -rf "$candidate_root"
          trap - EXIT
