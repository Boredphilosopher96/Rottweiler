name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: rottweiler-pages-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://boredphilosopher96.github.io/Rottweiler/
    steps:
      - name: Check out documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Build and verify the public site
        run: |
          bun install --cwd packages/docs-site --frozen-lockfile
          bun run --cwd packages/docs-site check
          bun run --cwd packages/docs-site test
          bun run --cwd packages/docs-site build
      - name: Check out the persistent Pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
      - name: Overlay documentation without changing signed updates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pages branch --show-current)" = gh-pages
          python3 scripts/publish-docs-site.py \
            --site packages/docs-site/dist \
            --checkout pages
          git -C pages add -A -- .
          git -C pages diff --cached --quiet -- updates
          git -C pages config user.name github-actions[bot]
          git -C pages config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "publish docs ${GITHUB_SHA}"
            git -C pages push origin HEAD:gh-pages
          fi
          expected=$(git -C pages rev-parse HEAD)
          observed=$(git -C pages ls-remote --exit-code origin refs/heads/gh-pages | awk '{print $1}')
          test "$observed" = "$expected"
