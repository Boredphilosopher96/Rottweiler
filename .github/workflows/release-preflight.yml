name: Release preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preflight
  cancel-in-progress: false

jobs:
  repository-prerequisites:
    name: Release repository and protected configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release qualification tier
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rw-cli"))')
          major=${version%%.*}
          case "$major" in
            ''|*[!0-9]*) echo "release version has an invalid major: $version" >&2; exit 1 ;;
          esac
          printf 'version=%s\nmajor=%s\n' "$version" "$major" >> "$GITHUB_OUTPUT"
      - name: Validate measured baselines and public signing inputs
        id: repository_readiness
        continue-on-error: true
        run: >-
          python3 scripts/check-release-readiness.py
          --release-version "${{ steps.release_version.outputs.version }}"
          --output release-readiness.json
      - name: Validate protected release configuration
        id: protected_configuration
        continue-on-error: true
        shell: bash
        env:
          SELF_HOSTED_RUNNERS_ENABLED: ${{ vars.ROTTWEILER_SELF_HOSTED_RUNNERS }}
          RELEASE_MAJOR: ${{ steps.release_version.outputs.major }}
          UPDATE_ROOT_VERSION: ${{ vars.ROTTWEILER_UPDATE_ROOT_VERSION }}
          UPDATE_ROOT_THRESHOLD: ${{ vars.ROTTWEILER_UPDATE_ROOT_THRESHOLD }}
          UPDATE_ROOT_KEYS_JSON: ${{ vars.ROTTWEILER_UPDATE_ROOT_KEYS_JSON }}
          UPDATE_BASE_URL: ${{ vars.ROTTWEILER_UPDATE_BASE_URL }}
          LIVE_ANTHROPIC_MODEL: ${{ vars.ROTTWEILER_LIVE_ANTHROPIC_MODEL }}
          LIVE_OPENAI_MODEL: ${{ vars.ROTTWEILER_LIVE_OPENAI_MODEL }}
          EVAL_MODEL: ${{ vars.ROTTWEILER_EVAL_MODEL }}
          TERMINAL_BENCH_BASELINE_JSON: ${{ vars.ROTTWEILER_TERMINAL_BENCH_BASELINE_JSON }}
          UPDATE_RELEASE_KEYS_JSON: ${{ secrets.ROTTWEILER_UPDATE_RELEASE_KEYS_JSON }}
          DOGFOOD_LEDGER_B64: ${{ secrets.ROTTWEILER_DOGFOOD_LEDGER_B64 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          required=(
            UPDATE_ROOT_VERSION
            UPDATE_ROOT_THRESHOLD
            UPDATE_ROOT_KEYS_JSON
            UPDATE_BASE_URL
            UPDATE_RELEASE_KEYS_JSON
            HOMEBREW_TAP_DEPLOY_KEY
          )
          case "$RELEASE_MAJOR" in
            ''|*[!0-9]*) echo "RELEASE_MAJOR must be numeric" >&2; exit 1 ;;
          esac
          if [ "$RELEASE_MAJOR" -ge 1 ]; then
            required+=(
              SELF_HOSTED_RUNNERS_ENABLED
              LIVE_ANTHROPIC_MODEL
              LIVE_OPENAI_MODEL
              EVAL_MODEL
              TERMINAL_BENCH_BASELINE_JSON
              DOGFOOD_LEDGER_B64
              OPENAI_API_KEY
              ANTHROPIC_API_KEY
            )
          fi
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'missing protected release configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [ "$RELEASE_MAJOR" -ge 1 ]; then
            test "$SELF_HOSTED_RUNNERS_ENABLED" = "true"
            case "$EVAL_MODEL" in
              openai/*-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]|anthropic/*-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
              *) echo "EVAL_MODEL must select an immutable dated OpenAI or Anthropic model" >&2; exit 1 ;;
            esac
          fi
          case "$UPDATE_BASE_URL" in
            https://*/) ;;
            *) echo "UPDATE_BASE_URL must be HTTPS and end in /" >&2; exit 1 ;;
          esac
      - name: Validate protected dogfood evidence
        id: dogfood
        continue-on-error: true
        if: steps.release_version.outputs.major != '0'
        shell: bash
        env:
          DOGFOOD_LEDGER_B64: ${{ secrets.ROTTWEILER_DOGFOOD_LEDGER_B64 }}
        run: |
          set -euo pipefail
          ledger=$(mktemp "$RUNNER_TEMP/rottweiler-preflight-dogfood.XXXXXX")
          trap 'rm -f "$ledger"' EXIT
          chmod 600 "$ledger"
          LEDGER="$ledger" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ.pop("DOGFOOD_LEDGER_B64", "")
          Path(os.environ["LEDGER"]).write_bytes(base64.b64decode(encoded, validate=True))
          PY
          python3 scripts/check-dogfood-gate.py "$ledger" --through "$(date -u +%F)"
      - name: Validate public channel metadata transition
        id: channel_transition
        continue-on-error: true
        shell: bash
        env:
          UPDATE_BASE_URL: ${{ vars.ROTTWEILER_UPDATE_BASE_URL }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/rottweiler-previous-channel"
          mkdir -p "$previous"
          previous_args=()
          for channel in stable beta; do
            temporary="$previous/$channel.json.tmp"
            status=$(curl \
              --silent --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --max-redirs 0 \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 1048576 \
              --output "$temporary" \
              --write-out '%{http_code}' \
              "${UPDATE_BASE_URL}${channel}.json")
            case "$status" in
              200)
                mv "$temporary" "$previous/$channel.json"
                previous_args+=("--previous-$channel" "$previous/$channel.json")
                ;;
              404) rm -f "$temporary" ;;
              *) echo "prior $channel metadata returned HTTP $status" >&2; exit 1 ;;
            esac
          done
          python3 scripts/check-release-channel-advance.py \
            --stable-spec release/update/stable.spec.json \
            --beta-spec release/update/beta.spec.json \
            "${previous_args[@]}" \
            --output release-channel-transition.json
      - name: Retain non-secret readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-readiness.json
            release-channel-transition.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce aggregate release readiness
        if: always()
        shell: bash
        env:
          RELEASE_MAJOR: ${{ steps.release_version.outputs.major }}
          REPOSITORY_OUTCOME: ${{ steps.repository_readiness.outcome }}
          CONFIGURATION_OUTCOME: ${{ steps.protected_configuration.outcome }}
          DOGFOOD_OUTCOME: ${{ steps.dogfood.outcome }}
          CHANNEL_TRANSITION_OUTCOME: ${{ steps.channel_transition.outcome }}
        run: |
          set -euo pipefail
          failed=()
          if [ "$REPOSITORY_OUTCOME" != success ]; then
            failed+=(repository-readiness)
          fi
          if [ "$CONFIGURATION_OUTCOME" != success ]; then
            failed+=(protected-configuration)
          fi
          if [ "$CHANNEL_TRANSITION_OUTCOME" != success ]; then
            failed+=(channel-metadata-transition)
          fi
          case "$RELEASE_MAJOR" in
            ''|*[!0-9]*) failed+=(release-version) ;;
            0) ;;
            *)
              if [ "$DOGFOOD_OUTCOME" != success ]; then
                failed+=(dogfood-evidence)
              fi
              ;;
          esac
          if [ "${#failed[@]}" -ne 0 ]; then
            printf 'release preflight failed checks: %s\n' "${failed[*]}" >&2
            exit 1
          fi

  protected-performance:
    name: Exact protected performance graph
    needs: repository-prerequisites
    uses: ./.github/workflows/performance.yml
    secrets: inherit

  seal-candidate:
    name: Seal exact-SHA release candidate evidence
    needs: [repository-prerequisites, protected-performance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download repository readiness evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-input/readiness
      - name: Download Linux performance evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manual-performance-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-input/linux
      - name: Download macOS performance evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manual-performance-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-input/darwin
      - name: Bind successful preflight evidence to this commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python3 scripts/release-candidate.py create \
            --path release-candidate.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --version "$version" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --readiness candidate-input/readiness \
            --linux-evidence candidate-input/linux \
            --darwin-evidence candidate-input/darwin
      - name: Retain immutable candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-candidate.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
