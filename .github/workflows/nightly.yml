name: Nightly hardening

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-hardening
  cancel-in-progress: true

jobs:
  runner-contract:
    name: Required hardening runner contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed when protected hardening runners are unavailable
        env:
          SELF_HOSTED_RUNNERS_ENABLED: ${{ vars.ROTTWEILER_SELF_HOSTED_RUNNERS }}
        run: |
          if [ "$SELF_HOSTED_RUNNERS_ENABLED" != "true" ]; then
            echo "ROTTWEILER_SELF_HOSTED_RUNNERS must be true; protected performance and soak jobs cannot silently skip" >&2
            exit 1
          fi

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [config_parser, toon_decoder, plugin_rpc, event_log]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Cache pinned cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz-0.13.2
      - name: Install pinned cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Run bounded sanitizer-backed campaign
        run: cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time=60 -rss_limit_mb=2048

  linux-performance-build:
    name: Build isolated Linux performance binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - name: Build performance binary outside the workspace
        run: scripts/prepare-linux-performance-binary.sh
      - name: Upload isolated Linux performance binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-performance-rw-${{ github.run_id }}
          path: ${{ runner.temp }}/rottweiler-linux-performance-artifact.noindex
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - run: bun run build
        working-directory: packages/tui
      - name: Checksum and upload Linux soak TUI
        shell: bash
        run: |
          cd packages/tui/dist
          sha256sum rottweiler-tui > rottweiler-tui.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-soak-tui-${{ github.run_id }}
          path: packages/tui/dist
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  macos-performance-build:
    name: Build isolated macOS performance binary
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - name: Build performance binary outside the workspace
        run: scripts/prepare-macos-performance-binary.sh
      - name: Upload isolated macOS performance binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-performance-rw-${{ github.run_id }}
          path: ${{ runner.temp }}/rottweiler-macos-performance-artifact.noindex
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - run: bun run build
        working-directory: packages/tui
      - name: Checksum and upload macOS soak TUI
        shell: bash
        run: |
          cd packages/tui/dist
          shasum -a 256 rottweiler-tui > rottweiler-tui.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-soak-tui-${{ github.run_id }}
          path: packages/tui/dist
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  linux-release-budget:
    name: Release budgets (protected Linux)
    needs: [runner-contract, linux-performance-build]
    # The fixed Ubuntu image is a native x86_64 lane and records its exact
    # runner-image provenance with every raw sample set.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p perf-results
      - name: Download isolated Linux performance binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-performance-rw-${{ github.run_id }}
          path: ${{ runner.temp }}/rottweiler-linux-performance-download.noindex
      - name: Verify isolated Linux performance binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rottweiler-linux-performance-download.noindex"
          sha256sum -c rw.sha256
          chmod 700 rw
      - name: Headless performance gate (Linux prebuilt binary)
        run: crates/rw-cli/tests/perf_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/headless.json
          ROTTWEILER_PERF_SAMPLES: 500
          ROTTWEILER_PERF_PREBUILT_RW: ${{ runner.temp }}/rottweiler-linux-performance-download.noindex/rw
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - run: crates/rw-cli/tests/m4_release_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m4.json
      - name: M8 production-composition performance gate (Linux)
        run: crates/rw-cli/tests/m8_release_gate_linux.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m8.json
      - run: bun run test:perf
        working-directory: packages/tui
        env:
          ROTTWEILER_PERF_OUTPUT: ${{ github.workspace }}/perf-results/tui.json
      - run: scripts/build-release.sh
      - name: Enforce checked-in platform baseline
        run: >-
          python3 scripts/check-perf-baseline.py
          --baseline benchmarks/performance-baseline.json
          --platform linux-x86_64
          --suite core
          --require-measured
          --measurement perf-results/headless.json
          --measurement perf-results/m4.json
          --measurement perf-results/m8.json
          --measurement perf-results/tui.json
          --output perf-results/baseline-result.json
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-performance-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-results
          if-no-files-found: warn
          retention-days: 30
      - name: Reclaim persistent runner workspace
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$GITHUB_WORKSPACE/target" \
            "$GITHUB_WORKSPACE/dist" \
            "$GITHUB_WORKSPACE/perf-results" \
            "$GITHUB_WORKSPACE/packages/tui/dist" \
            "$GITHUB_WORKSPACE/packages/tui/node_modules" \
            "$RUNNER_TEMP/rottweiler-linux-performance-download.noindex"

  macos-release-budget:
    name: Release budgets (fixed hosted macOS)
    needs: runner-contract
    # The fixed native ARM64 image avoids workstation Gatekeeper/XProtect
    # provenance noise and records exact runner-image provenance in evidence.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p perf-results
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - name: Build isolated macOS binary on the measurement host
        run: scripts/prepare-macos-performance-binary.sh
      - name: Headless performance gate (macOS measurement-host binary)
        run: crates/rw-cli/tests/perf_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/headless.json
          ROTTWEILER_PERF_SAMPLES: 500
          ROTTWEILER_PERF_PREBUILT_RW: ${{ runner.temp }}/rottweiler-macos-performance-artifact.noindex/rw
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - run: crates/rw-cli/tests/m4_release_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m4.json
      - name: M8 production-composition performance gate (macOS)
        run: crates/rw-cli/tests/m8_release_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m8.json
      - run: bun run test:perf
        working-directory: packages/tui
        env:
          ROTTWEILER_PERF_OUTPUT: ${{ github.workspace }}/perf-results/tui.json
      - run: scripts/build-release.sh
      - name: Enforce checked-in platform baseline
        run: >-
          python3 scripts/check-perf-baseline.py
          --baseline benchmarks/performance-baseline.json
          --platform darwin-arm64
          --suite core
          --require-measured
          --measurement perf-results/headless.json
          --measurement perf-results/m4.json
          --measurement perf-results/m8.json
          --measurement perf-results/tui.json
          --output perf-results/baseline-result.json
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-performance-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-results
          if-no-files-found: warn
          retention-days: 30
      - name: Reclaim persistent runner workspace
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$GITHUB_WORKSPACE/target" \
            "$GITHUB_WORKSPACE/dist" \
            "$GITHUB_WORKSPACE/perf-results" \
            "$GITHUB_WORKSPACE/packages/tui/dist" \
            "$GITHUB_WORKSPACE/packages/tui/node_modules" \
            "$RUNNER_TEMP/rottweiler-macos-performance-artifact.noindex" \
            "$RUNNER_TEMP/rottweiler-macos-performance-build.noindex"

  eight-hour-soak:
    name: Eight-hour supervised soak (${{ matrix.platform }})
    if: vars.ROTTWEILER_SELF_HOSTED_RUNNERS == 'true'
    needs: [runner-contract, linux-performance-build, macos-performance-build]
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 510
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: '["self-hosted","macOS","ARM64","soak"]'
            artifact: macos-performance-rw-${{ github.run_id }}
            tui_artifact: macos-soak-tui-${{ github.run_id }}
          - platform: linux-x86_64
            runner: '["self-hosted","Linux","X64","soak"]'
            artifact: linux-performance-rw-${{ github.run_id }}
            tui_artifact: linux-soak-tui-${{ github.run_id }}
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download isolated performance binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/rottweiler-soak-binary.noindex
      - name: Verify isolated performance binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rottweiler-soak-binary.noindex"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = Path("rw.sha256").read_text(encoding="utf-8").split()[0]
          actual = hashlib.sha256(Path("rw").read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"rw checksum mismatch: expected {expected}, got {actual}")
          PY
          chmod 700 rw
      - name: Download hosted soak TUI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.tui_artifact }}
          path: packages/tui/dist
      - name: Verify hosted soak TUI
        shell: bash
        run: |
          set -euo pipefail
          cd packages/tui/dist
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = Path("rottweiler-tui.sha256").read_text(encoding="utf-8").split()[0]
          actual = hashlib.sha256(Path("rottweiler-tui").read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"TUI checksum mismatch: expected {expected}, got {actual}")
          PY
          chmod 700 rottweiler-tui
      - name: Run the real supervisor, engine, and OpenTUI for eight hours
        run: >-
          python3 scripts/run-soak.py
          --rw "$RUNNER_TEMP/rottweiler-soak-binary.noindex/rw"
          --tui packages/tui/dist/rottweiler-tui
          --duration-seconds 28800
          --output soak-result.json
      - name: Enforce the checked-in 10 percent regression baseline
        run: >-
          python3 scripts/check-perf-baseline.py
          --baseline benchmarks/performance-baseline.json
          --platform "${{ matrix.platform }}"
          --suite soak
          --measurement soak-result.json
          --output soak-baseline-result.json
      - name: Retain soak measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soak-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            soak-result.json
            soak-baseline-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Reclaim persistent runner workspace
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$GITHUB_WORKSPACE/target" \
            "$GITHUB_WORKSPACE/dist" \
            "$GITHUB_WORKSPACE/soak-result.json" \
            "$GITHUB_WORKSPACE/soak-baseline-result.json" \
            "$GITHUB_WORKSPACE/packages/tui/dist" \
            "$GITHUB_WORKSPACE/packages/tui/node_modules" \
            "$RUNNER_TEMP/rottweiler-soak-binary.noindex"

  wsl2-acceptance:
    name: WSL2 release, sandbox, doctor, and DrvFS acceptance
    # The Windows 2025 hosted image includes WSL2 and provides a clean native
    # Windows/DrvFS boundary for every run.
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision clean Ubuntu 24.04 WSL2 distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          wsl.exe --status
          if ($LASTEXITCODE -ne 0) { throw "WSL2 is unavailable" }
          wsl.exe --set-default-version 2
          if ($LASTEXITCODE -ne 0) { throw "WSL2 could not be selected" }
          wsl.exe --install --distribution Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { throw "Ubuntu 24.04 WSL2 installation failed" }
          wsl.exe --distribution Ubuntu-24.04 --user root --exec true
          if ($LASTEXITCODE -ne 0) { throw "Ubuntu 24.04 WSL2 initialization failed" }
          $workspace = (wsl.exe --distribution Ubuntu-24.04 --exec wslpath -a "$env:GITHUB_WORKSPACE").Trim()
          if ($LASTEXITCODE -ne 0) { throw "checkout path could not be translated into WSL" }
          wsl.exe --distribution Ubuntu-24.04 --user root --exec bash "$workspace/scripts/provision-wsl-ci.sh"
          if ($LASTEXITCODE -ne 0) { throw "WSL build-tool provisioning failed" }
      - name: Execute inside the configured WSL2 distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = (wsl.exe --distribution Ubuntu-24.04 --exec wslpath -a "$env:GITHUB_WORKSPACE").Trim()
          if ($LASTEXITCODE -ne 0) { throw "checkout path could not be translated into WSL" }
          if (-not $workspace.StartsWith("/mnt/")) { throw "checkout is not visible through WSL" }
          wsl.exe --distribution Ubuntu-24.04 --exec bash "$workspace/scripts/wsl-acceptance.sh" "$workspace"
          if ($LASTEXITCODE -ne 0) { throw "WSL acceptance failed" }

  terminal-bench:
    name: Terminal-Bench 2.1 pinned subset
    # Harbor's containers run on the disposable GitHub-hosted Linux machine,
    # never on a maintainer workstation.
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    environment: release
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
      ROTTWEILER_EVAL_MODEL: ${{ vars.ROTTWEILER_EVAL_MODEL }}
      ROTTWEILER_EVAL_CONCURRENCY: "4"
      ROTTWEILER_EVAL_OUTPUT_DIR: ${{ github.workspace }}/terminal-bench-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve capability qualification tier
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          major=${version%%.*}
          case "$major" in
            ''|*[!0-9]*) echo "release version has an invalid major: $version" >&2; exit 1 ;;
          esac
          printf 'major=%s\n' "$major" >> "$GITHUB_OUTPUT"
      - name: Record pre-v1 capability-eval deferral
        if: steps.release_version.outputs.major == '0'
        run: echo 'Terminal-Bench is a v1 qualification gate and is not claimed by this pre-v1 build.'
      - name: Install Rust toolchain
        if: steps.release_version.outputs.major != '0'
        run: rustup toolchain install 1.97.1 --profile minimal
      - if: steps.release_version.outputs.major != '0'
        run: rustup override set 1.97.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.release_version.outputs.major != '0'
        with:
          bun-version: 1.3.14
      - name: Install pinned Harbor harness
        if: steps.release_version.outputs.major != '0'
        run: pipx install --force harbor==0.18.0
      - if: steps.release_version.outputs.major != '0'
        run: bun install --frozen-lockfile
        working-directory: packages/tui
      - name: Build exact Linux release under test
        if: steps.release_version.outputs.major != '0'
        run: |
          archive=$(scripts/build-release.sh | tail -1)
          test -f "$archive"
          printf 'ROTTWEILER_RELEASE_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Run pinned 20-task subset
        if: steps.release_version.outputs.major != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "$ROTTWEILER_EVAL_MODEL" in
            openai/*) key=$OPENAI_API_KEY ;;
            anthropic/*) key=$ANTHROPIC_API_KEY ;;
            *) echo 'ROTTWEILER_EVAL_MODEL must select OpenAI or Anthropic' >&2; exit 1 ;;
          esac
          test -n "$key"
          ROTTWEILER_EVAL_API_KEY="$key" scripts/run-terminal-bench.sh
      - name: Enforce protected solve-rate, token, wall-time, and cost baseline
        if: steps.release_version.outputs.major != '0'
        env:
          TERMINAL_BENCH_BASELINE_JSON: ${{ vars.ROTTWEILER_TERMINAL_BENCH_BASELINE_JSON }}
        run: |
          test -n "$TERMINAL_BENCH_BASELINE_JSON"
          printf '%s\n' "$TERMINAL_BENCH_BASELINE_JSON" > terminal-bench-baseline.json
          python3 scripts/check-terminal-bench.py terminal-bench-evidence terminal-bench-baseline.json \
            --expected-git "$GITHUB_SHA" --archive "$ROTTWEILER_RELEASE_ARCHIVE" \
            | tee terminal-bench-evidence/rottweiler-gate-result.json
      - name: Retain complete Harbor evidence
        if: ${{ always() && steps.release_version.outputs.major != '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: terminal-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: terminal-bench-evidence
          if-no-files-found: error
          retention-days: 90
