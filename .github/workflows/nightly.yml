name: Nightly hardening

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-hardening
  cancel-in-progress: true

jobs:
  runner-contract:
    name: Required hardening runner contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect actual protected runner capacity
        env:
          GH_TOKEN: ${{ secrets.ROTTWEILER_RUNNER_READ_TOKEN || github.token }}
        run: python3 scripts/check-runner-capacity.py --repository "$GITHUB_REPOSITORY" --output runner-capacity.json
      - name: Retain runner availability
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runner-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: runner-capacity.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed when protected hardening runners are unavailable
        env:
          SELF_HOSTED_RUNNERS_ENABLED: ${{ vars.ROTTWEILER_SELF_HOSTED_RUNNERS }}
        run: |
          if [ "$SELF_HOSTED_RUNNERS_ENABLED" != "true" ]; then
            echo "ROTTWEILER_SELF_HOSTED_RUNNERS must be true; protected performance and soak jobs cannot silently skip" >&2
            exit 1
          fi

  fuzz-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.owner.outputs.targets }}
      toolchain: ${{ steps.owner.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: owner
        run: |
          python3 - <<'PYTHON'
          import json, os, tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path("fuzz/Cargo.toml").read_text())
          toolchain = tomllib.loads(Path("fuzz/rust-toolchain.toml").read_text())["toolchain"]["channel"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("targets=" + json.dumps([target["name"] for target in manifest["bin"]]), file=output)
              print("toolchain=" + toolchain, file=output)
          PYTHON

  fuzz:
    needs: fuzz-targets
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        env:
          FUZZ_TOOLCHAIN: ${{ needs.fuzz-targets.outputs.toolchain }}
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - name: Cache pinned cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz-0.13.2
      - name: Install pinned cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Run bounded sanitizer-backed campaign
        env:
          FUZZ_TOOLCHAIN: ${{ needs.fuzz-targets.outputs.toolchain }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz run "$FUZZ_TARGET" -- -max_total_time=60 -rss_limit_mb=2048

  linux-candidate-build:
    name: Build native Linux candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      candidate_artifact: linux-native-candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/native-candidate"
          key: native-candidate
      - name: Build and enforce native component sizes
        id: candidate
        run: >-
          python3 scripts/ci_evidence.py --gate build-and-size --output ci-results/build.json --
          python3 scripts/build-native-candidate.py
          --output "$RUNNER_TEMP/native-candidates.noindex"
          --target-dir "$GITHUB_WORKSPACE/target/native-candidate"
          --github-output "$GITHUB_OUTPUT"
      - name: Upload verified native candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-native-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.candidate.outputs.candidate }}
          if-no-files-found: error
          retention-days: 14
      - name: Retain build and size evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-build-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 30


  macos-candidate-build:
    name: Build native macOS candidate
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      candidate_artifact: macos-native-candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/native-candidate"
          key: native-candidate
      - name: Build and enforce native component sizes
        id: candidate
        run: >-
          python3 scripts/ci_evidence.py --gate build-and-size --output ci-results/build.json --
          python3 scripts/build-native-candidate.py
          --output "$RUNNER_TEMP/native-candidates.noindex"
          --target-dir "$GITHUB_WORKSPACE/target/native-candidate"
          --github-output "$GITHUB_OUTPUT"
      - name: Upload verified native candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-native-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.candidate.outputs.candidate }}
          if-no-files-found: error
          retention-days: 14
      - name: Retain build and size evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-build-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 30


  linux-release-budget:
    name: Release budgets (protected Linux)
    needs: linux-candidate-build
    # The fixed Ubuntu image is a native x86_64 lane and records its exact
    # runner-image provenance with every raw sample set.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p perf-results
      - name: Download native candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.linux-candidate-build.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/native-candidate.noindex
      - name: Verify candidate and restore executable modes
        run: |
          python3 scripts/native_candidate.py prepare "$RUNNER_TEMP/native-candidate.noindex"
          cp "$RUNNER_TEMP/native-candidate.noindex/build.json" perf-results/native-build.json
          cp "$RUNNER_TEMP/native-candidate.noindex/bundle-identity.json" perf-results/native-bundle.json
      - name: Headless performance gate (Linux prebuilt binary)
        run: crates/rw-cli/tests/perf_gate.sh "$RUNNER_TEMP/native-candidate.noindex"
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/headless.json
          ROTTWEILER_PERF_SAMPLES: 500
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - name: Prepare verified source renderer
        run: |
          library=$(python3 scripts/build-opentui-native.py)
          echo "ROTTWEILER_OPENTUI_LIBRARY=$library" >> "$GITHUB_ENV"
      - run: crates/rw-cli/tests/m4_release_gate.sh "$RUNNER_TEMP/native-candidate.noindex"
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m4.json
      - name: M8 production-composition performance gate (Linux)
        run: crates/rw-cli/tests/m8_release_gate_linux.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m8.json
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-candidate
      - run: bun run test:perf
        working-directory: packages/tui
        env:
          ROTTWEILER_PERF_OUTPUT: ${{ github.workspace }}/perf-results/tui.json
      - name: Enforce checked-in platform baseline
        run: >-
          python3 scripts/check-perf-baseline.py
          --baseline benchmarks/performance-baseline.json
          --platform linux-x86_64
          --suite core
          --require-measured
          --measurement perf-results/headless.json
          --measurement perf-results/m4.json
          --measurement perf-results/m8.json
          --measurement perf-results/tui.json
          --output perf-results/baseline-result.json
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-performance-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-results
          if-no-files-found: warn
          retention-days: 30
      - name: Reclaim persistent runner workspace
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$GITHUB_WORKSPACE/target" \
            "$GITHUB_WORKSPACE/dist" \
            "$GITHUB_WORKSPACE/perf-results" \
            "$GITHUB_WORKSPACE/packages/js-host/dist" \
            "$GITHUB_WORKSPACE/packages/js-host/node_modules" \
            "$GITHUB_WORKSPACE/packages/tui/dist" \
            "$GITHUB_WORKSPACE/packages/tui/node_modules" \
            "$RUNNER_TEMP/native-candidate.noindex"

  macos-release-budget:
    name: Release budgets (fixed hosted macOS)
    # The fixed native ARM64 image avoids workstation Gatekeeper/XProtect
    # provenance noise and records exact runner-image provenance in evidence.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p perf-results
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Build candidate on the macOS measurement host
        id: candidate
        run: >-
          python3 scripts/ci_evidence.py --gate build-and-size --output perf-results/build.json --
          python3 scripts/build-native-candidate.py
          --output "$RUNNER_TEMP/native-candidates.noindex"
          --target-dir "$GITHUB_WORKSPACE/target/native-candidate"
          --github-output "$GITHUB_OUTPUT"
      - name: Prepare MCP acceptance fixture before measurement
        id: mcp-fixture
        run: |
          scripts/cargo-release.sh build --locked --release -p rw-mcp --features rw-mcp/test-support --bin rw-mcp-fixture
          release_dir=$(scripts/cargo-release.sh artifact-dir)
          echo "executable=$release_dir/rw-mcp-fixture" >> "$GITHUB_OUTPUT"
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-candidate
          CARGO_PROFILE_RELEASE_DEBUG: 0
      - name: Retain native candidate identity
        run: |
          cp "${{ steps.candidate.outputs.candidate }}/build.json" perf-results/native-build.json
          cp "${{ steps.candidate.outputs.candidate }}/bundle-identity.json" perf-results/native-bundle.json
      - name: Headless performance gate (macOS measurement-host binary)
        run: crates/rw-cli/tests/perf_gate.sh "${{ steps.candidate.outputs.candidate }}"
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/headless.json
          ROTTWEILER_PERF_SAMPLES: 500
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - name: Prepare verified source renderer
        run: |
          library=$(python3 scripts/build-opentui-native.py)
          echo "ROTTWEILER_OPENTUI_LIBRARY=$library" >> "$GITHUB_ENV"
      - run: crates/rw-cli/tests/m4_release_gate.sh "${{ steps.candidate.outputs.candidate }}"
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m4.json
      - name: M8 production-composition performance gate (macOS)
        run: |
          engine=$(python3 scripts/native_candidate.py path "${{ steps.candidate.outputs.candidate }}" engine)
          crates/rw-cli/tests/m8_release_gate.sh "$engine" "${{ steps.mcp-fixture.outputs.executable }}"
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m8.json
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-candidate
      - run: bun run test:perf
        working-directory: packages/tui
        env:
          ROTTWEILER_PERF_OUTPUT: ${{ github.workspace }}/perf-results/tui.json
      - name: Enforce checked-in platform baseline
        run: >-
          python3 scripts/check-perf-baseline.py
          --baseline benchmarks/performance-baseline.json
          --platform darwin-arm64
          --suite core
          --require-measured
          --measurement perf-results/headless.json
          --measurement perf-results/m4.json
          --measurement perf-results/m8.json
          --measurement perf-results/tui.json
          --output perf-results/baseline-result.json
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-performance-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-results
          if-no-files-found: warn
          retention-days: 30
      - name: Reclaim persistent runner workspace
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$GITHUB_WORKSPACE/target" \
            "$GITHUB_WORKSPACE/dist" \
            "$GITHUB_WORKSPACE/perf-results" \
            "$GITHUB_WORKSPACE/packages/js-host/dist" \
            "$GITHUB_WORKSPACE/packages/js-host/node_modules" \
            "$GITHUB_WORKSPACE/packages/tui/dist" \
            "$GITHUB_WORKSPACE/packages/tui/node_modules" \
            "$RUNNER_TEMP/native-candidates.noindex" \
            "$GITHUB_WORKSPACE/target/native-candidate"

  macos-soak-dispatch:
    name: Dispatch darwin-arm64 soak
    needs: macos-candidate-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CI Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-python"
          "$RUNNER_TEMP/ci-python/bin/pip" install -r scripts/requirements-ci.txt
          echo "$RUNNER_TEMP/ci-python/bin" >> "$GITHUB_PATH"
      - name: Check platform runner admission
        env:
          GH_TOKEN: ${{ secrets.ROTTWEILER_RUNNER_READ_TOKEN || github.token }}
        run: python3 scripts/check-runner-capacity.py --repository "$GITHUB_REPOSITORY" --platform darwin-arm64 --output runner-capacity.json
      - name: Dispatch independently bounded worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/soak_dispatch.py dispatch --repository "$GITHUB_REPOSITORY"
          --platform darwin-arm64 --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --sha "$GITHUB_SHA" --output soak-dispatch.json
      - name: Retain queue evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soak-dispatch-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runner-capacity.json
            soak-dispatch.json
          if-no-files-found: error
          retention-days: 30

  linux-soak-dispatch:
    name: Dispatch linux-x86_64 soak
    needs: linux-candidate-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CI Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-python"
          "$RUNNER_TEMP/ci-python/bin/pip" install -r scripts/requirements-ci.txt
          echo "$RUNNER_TEMP/ci-python/bin" >> "$GITHUB_PATH"
      - name: Check platform runner admission
        env:
          GH_TOKEN: ${{ secrets.ROTTWEILER_RUNNER_READ_TOKEN || github.token }}
        run: python3 scripts/check-runner-capacity.py --repository "$GITHUB_REPOSITORY" --platform linux-x86_64 --output runner-capacity.json
      - name: Dispatch independently bounded worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/soak_dispatch.py dispatch --repository "$GITHUB_REPOSITORY"
          --platform linux-x86_64 --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --sha "$GITHUB_SHA" --output soak-dispatch.json
      - name: Retain queue evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soak-dispatch-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runner-capacity.json
            soak-dispatch.json
          if-no-files-found: error
          retention-days: 30

  wsl2-acceptance:
    name: WSL2 release, sandbox, doctor, and DrvFS acceptance
    # The Windows 2025 hosted image includes WSL2 and provides a clean native
    # Windows/DrvFS boundary for every run.
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision clean Ubuntu 24.04 WSL2 distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          wsl.exe --status
          if ($LASTEXITCODE -ne 0) { throw "WSL2 is unavailable" }
          wsl.exe --set-default-version 2
          if ($LASTEXITCODE -ne 0) { throw "WSL2 could not be selected" }
          wsl.exe --install --distribution Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { throw "Ubuntu 24.04 WSL2 installation failed" }
          wsl.exe --distribution Ubuntu-24.04 --user root --exec true
          if ($LASTEXITCODE -ne 0) { throw "Ubuntu 24.04 WSL2 initialization failed" }
          $workspace = (wsl.exe --distribution Ubuntu-24.04 --exec wslpath -a "$env:GITHUB_WORKSPACE").Trim()
          if ($LASTEXITCODE -ne 0) { throw "checkout path could not be translated into WSL" }
          wsl.exe --distribution Ubuntu-24.04 --user root --exec bash "$workspace/scripts/provision-wsl-ci.sh"
          if ($LASTEXITCODE -ne 0) { throw "WSL build-tool provisioning failed" }
      - name: Execute inside the configured WSL2 distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = (wsl.exe --distribution Ubuntu-24.04 --exec wslpath -a "$env:GITHUB_WORKSPACE").Trim()
          if ($LASTEXITCODE -ne 0) { throw "checkout path could not be translated into WSL" }
          if (-not $workspace.StartsWith("/mnt/")) { throw "checkout is not visible through WSL" }
          wsl.exe --distribution Ubuntu-24.04 --exec bash "$workspace/scripts/wsl-acceptance.sh" "$workspace"
          if ($LASTEXITCODE -ne 0) { throw "WSL acceptance failed" }

  terminal-bench:
    name: Terminal-Bench 2.1 pinned subset
    # Harbor's containers run on the disposable GitHub-hosted Linux machine,
    # never on a maintainer workstation.
    needs: linux-candidate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    environment: release
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
      ROTTWEILER_EVAL_MODEL: ${{ vars.ROTTWEILER_EVAL_MODEL }}
      ROTTWEILER_EVAL_CONCURRENCY: "4"
      ROTTWEILER_EVAL_OUTPUT_DIR: ${{ github.workspace }}/terminal-bench-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve capability qualification tier
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          major=${version%%.*}
          case "$major" in
            ''|*[!0-9]*) echo "release version has an invalid major: $version" >&2; exit 1 ;;
          esac
          printf 'major=%s\n' "$major" >> "$GITHUB_OUTPUT"
      - name: Record pre-v1 capability-eval deferral
        if: steps.release_version.outputs.major == '0'
        run: echo 'Terminal-Bench is a v1 qualification gate and is not claimed by this pre-v1 build.'
      - name: Install pinned Harbor harness
        if: steps.release_version.outputs.major != '0'
        run: pipx install --force harbor==0.18.0
      - name: Download exact Linux native candidate
        if: steps.release_version.outputs.major != '0'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.linux-candidate-build.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/native-candidate.noindex
      - name: Verify exact Linux release under test
        if: steps.release_version.outputs.major != '0'
        run: |
          archive=$(python3 scripts/native_candidate.py path "$RUNNER_TEMP/native-candidate.noindex" archive)
          printf 'ROTTWEILER_RELEASE_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Run pinned 20-task subset
        if: steps.release_version.outputs.major != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "$ROTTWEILER_EVAL_MODEL" in
            openai/*) key=$OPENAI_API_KEY ;;
            anthropic/*) key=$ANTHROPIC_API_KEY ;;
            *) echo 'ROTTWEILER_EVAL_MODEL must select OpenAI or Anthropic' >&2; exit 1 ;;
          esac
          test -n "$key"
          ROTTWEILER_EVAL_API_KEY="$key" scripts/run-terminal-bench.sh
      - name: Enforce protected solve-rate, token, wall-time, and cost baseline
        if: steps.release_version.outputs.major != '0'
        env:
          TERMINAL_BENCH_BASELINE_JSON: ${{ vars.ROTTWEILER_TERMINAL_BENCH_BASELINE_JSON }}
        run: |
          test -n "$TERMINAL_BENCH_BASELINE_JSON"
          printf '%s\n' "$TERMINAL_BENCH_BASELINE_JSON" > terminal-bench-baseline.json
          python3 scripts/check-terminal-bench.py terminal-bench-evidence terminal-bench-baseline.json \
            --expected-git "$GITHUB_SHA" --archive "$ROTTWEILER_RELEASE_ARCHIVE" \
            | tee terminal-bench-evidence/rottweiler-gate-result.json
      - name: Retain complete Harbor evidence
        if: ${{ always() && steps.release_version.outputs.major != '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: terminal-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: terminal-bench-evidence
          if-no-files-found: error
          retention-days: 90
