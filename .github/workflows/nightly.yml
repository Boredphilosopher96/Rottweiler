name: Nightly hardening

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-hardening
  cancel-in-progress: true

jobs:
  runner-contract:
    name: Required hardening runner contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed when protected hardening runners are unavailable
        env:
          SELF_HOSTED_RUNNERS_ENABLED: ${{ vars.ROTTWEILER_SELF_HOSTED_RUNNERS }}
        run: |
          if [ "$SELF_HOSTED_RUNNERS_ENABLED" != "true" ]; then
            echo "ROTTWEILER_SELF_HOSTED_RUNNERS must be true; performance, soak, WSL2, and Terminal-Bench cannot silently skip" >&2
            exit 1
          fi

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [config_parser, toon_decoder, plugin_rpc, event_log]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Cache pinned cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz-0.13.2
      - name: Install pinned cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Run bounded sanitizer-backed campaign
        run: cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time=60 -rss_limit_mb=2048

  linux-performance-build:
    name: Build isolated Linux performance binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - name: Build performance binary outside the workspace
        run: scripts/prepare-linux-performance-binary.sh
      - name: Upload isolated Linux performance binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-performance-rw-${{ github.run_id }}
          path: ${{ runner.temp }}/rottweiler-linux-performance-artifact.noindex
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  macos-performance-build:
    name: Build isolated macOS performance binary
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - name: Build performance binary outside the workspace
        run: scripts/prepare-macos-performance-binary.sh
      - name: Upload isolated macOS performance binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-performance-rw-${{ github.run_id }}
          path: ${{ runner.temp }}/rottweiler-macos-performance-artifact.noindex
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  linux-release-budget:
    name: Release budgets (protected Linux)
    needs: [runner-contract, linux-performance-build]
    # Full absolute p99 evidence requires a calibrated, protected runner.
    # Shared hosted runners remain limited to the bounded per-PR smoke gate.
    runs-on: [self-hosted, Linux, X64, performance]
    timeout-minutes: 60
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - run: mkdir -p perf-results
      - name: Download isolated Linux performance binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-performance-rw-${{ github.run_id }}
          path: ${{ runner.temp }}/rottweiler-linux-performance-download.noindex
      - name: Verify isolated Linux performance binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rottweiler-linux-performance-download.noindex"
          sha256sum -c rw.sha256
          chmod 700 rw
      - name: Headless performance gate (Linux prebuilt binary)
        run: crates/rw-cli/tests/perf_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/headless.json
          ROTTWEILER_PERF_SAMPLES: 500
          ROTTWEILER_PERF_PREBUILT_RW: ${{ runner.temp }}/rottweiler-linux-performance-download.noindex/rw
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - run: crates/rw-cli/tests/m4_release_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m4.json
      - name: M8 production-composition performance gate (Linux)
        run: crates/rw-cli/tests/m8_release_gate_linux.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m8.json
      - run: bun run test:perf
        working-directory: packages/tui
        env:
          ROTTWEILER_PERF_OUTPUT: ${{ github.workspace }}/perf-results/tui.json
      - run: scripts/build-release.sh
      - name: Enforce checked-in platform baseline
        run: >-
          python3 scripts/check-perf-baseline.py
          --baseline benchmarks/performance-baseline.json
          --platform linux-x86_64
          --suite core
          --require-measured
          --measurement perf-results/headless.json
          --measurement perf-results/m4.json
          --measurement perf-results/m8.json
          --measurement perf-results/tui.json
          --output perf-results/baseline-result.json
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-performance-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-results
          if-no-files-found: warn
          retention-days: 30

  macos-release-budget:
    name: Release budgets (protected macOS)
    needs: [runner-contract, macos-performance-build]
    # Full absolute p99 evidence requires a calibrated, protected runner.
    # Shared hosted runners remain limited to the bounded per-PR smoke gate.
    runs-on: [self-hosted, macOS, ARM64, performance]
    timeout-minutes: 60
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - run: mkdir -p perf-results
      - name: Download isolated macOS performance binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-performance-rw-${{ github.run_id }}
          path: ${{ runner.temp }}/rottweiler-macos-performance-download.noindex
      - name: Verify isolated macOS performance binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rottweiler-macos-performance-download.noindex"
          shasum -a 256 -c rw.sha256
          chmod 700 rw
      - name: Headless performance gate (macOS prebuilt binary)
        run: crates/rw-cli/tests/perf_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/headless.json
          ROTTWEILER_PERF_SAMPLES: 500
          ROTTWEILER_PERF_PREBUILT_RW: ${{ runner.temp }}/rottweiler-macos-performance-download.noindex/rw
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - run: crates/rw-cli/tests/m4_release_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m4.json
      - name: M8 production-composition performance gate (macOS)
        run: crates/rw-cli/tests/m8_release_gate.sh
        env:
          ROTTWEILER_PERF_OUTPUT: perf-results/m8.json
      - run: bun run test:perf
        working-directory: packages/tui
        env:
          ROTTWEILER_PERF_OUTPUT: ${{ github.workspace }}/perf-results/tui.json
      - run: scripts/build-release.sh
      - name: Enforce checked-in platform baseline
        run: >-
          python3 scripts/check-perf-baseline.py
          --baseline benchmarks/performance-baseline.json
          --platform darwin-arm64
          --suite core
          --require-measured
          --measurement perf-results/headless.json
          --measurement perf-results/m4.json
          --measurement perf-results/m8.json
          --measurement perf-results/tui.json
          --output perf-results/baseline-result.json
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-performance-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-results
          if-no-files-found: warn
          retention-days: 30

  eight-hour-soak:
    name: Eight-hour supervised soak (${{ matrix.platform }})
    # Gate until self-hosted runners exist; set ROTTWEILER_SELF_HOSTED_RUNNERS=true to re-enable.
    if: vars.ROTTWEILER_SELF_HOSTED_RUNNERS == 'true'
    needs: runner-contract
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 510
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: '["self-hosted","macOS","ARM64","soak"]'
          - platform: linux-x86_64
            runner: '["self-hosted","Linux","X64","soak"]'
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - run: scripts/cargo-release.sh build --locked --release -p rw-cli
      - run: bun run build
        working-directory: packages/tui
      - name: Run the real supervisor, engine, and OpenTUI for eight hours
        run: >-
          python3 scripts/run-soak.py
          --rw "$(scripts/cargo-release.sh artifact-dir)/rw"
          --tui packages/tui/dist/rottweiler-tui
          --duration-seconds 28800
          --output soak-result.json
      - name: Enforce the checked-in 10 percent regression baseline
        run: >-
          python3 scripts/check-perf-baseline.py
          --baseline benchmarks/performance-baseline.json
          --platform "${{ matrix.platform }}"
          --suite soak
          --require-measured
          --measurement soak-result.json
          --output soak-baseline-result.json
      - name: Retain soak measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soak-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            soak-result.json
            soak-baseline-result.json
          if-no-files-found: error
          retention-days: 30

  wsl2-acceptance:
    name: WSL2 release, sandbox, doctor, and DrvFS acceptance
    # Gate until self-hosted runners exist; set ROTTWEILER_SELF_HOSTED_RUNNERS=true to re-enable.
    if: vars.ROTTWEILER_SELF_HOSTED_RUNNERS == 'true'
    needs: runner-contract
    runs-on: [self-hosted, Windows, X64, wsl2]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Execute inside the configured WSL2 distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          wsl.exe --status
          $workspace = (wsl.exe wslpath -a "$env:GITHUB_WORKSPACE").Trim()
          if (-not $workspace.StartsWith("/mnt/")) { throw "checkout is not visible through WSL" }
          wsl.exe bash -lc "bash '$workspace/scripts/wsl-acceptance.sh' '$workspace'"

  terminal-bench:
    name: Terminal-Bench 2.1 pinned subset
    # Gate until self-hosted runners exist; set ROTTWEILER_SELF_HOSTED_RUNNERS=true to re-enable.
    if: vars.ROTTWEILER_SELF_HOSTED_RUNNERS == 'true'
    needs: runner-contract
    runs-on: [self-hosted, Linux, X64, terminal-bench]
    timeout-minutes: 720
    env:
      ROTTWEILER_CREDENTIAL_BACKEND: file
      ROTTWEILER_EVAL_MODEL: ${{ vars.ROTTWEILER_EVAL_MODEL }}
      ROTTWEILER_EVAL_CONCURRENCY: "4"
      ROTTWEILER_EVAL_OUTPUT_DIR: ${{ github.workspace }}/terminal-bench-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install pinned Harbor harness
        run: pipx install --force harbor==0.18.0
      - run: bun install --frozen-lockfile
        working-directory: packages/tui
      - name: Build exact Linux release under test
        run: |
          archive=$(scripts/build-release.sh | tail -1)
          test -f "$archive"
          printf 'ROTTWEILER_RELEASE_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Run pinned 20-task subset
        run: scripts/run-terminal-bench.sh
        env:
          ROTTWEILER_EVAL_API_KEY: ${{ secrets.ROTTWEILER_EVAL_API_KEY }}
      - name: Enforce protected solve-rate, token, wall-time, and cost baseline
        env:
          TERMINAL_BENCH_BASELINE_JSON: ${{ vars.ROTTWEILER_TERMINAL_BENCH_BASELINE_JSON }}
        run: |
          test -n "$TERMINAL_BENCH_BASELINE_JSON"
          printf '%s\n' "$TERMINAL_BENCH_BASELINE_JSON" > terminal-bench-baseline.json
          python3 scripts/check-terminal-bench.py terminal-bench-evidence terminal-bench-baseline.json \
            --expected-git "$GITHUB_SHA" --archive "$ROTTWEILER_RELEASE_ARCHIVE" \
            | tee terminal-bench-evidence/rottweiler-gate-result.json
      - name: Retain complete Harbor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: terminal-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: terminal-bench-evidence
          if-no-files-found: error
          retention-days: 90
