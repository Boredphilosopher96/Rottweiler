version: 2

multi-ecosystem-groups:
  application-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Chicago

  automation-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: application-dependencies
    open-pull-requests-limit: 1

  # BEGIN package inventory projection
  - package-ecosystem: bun
    directory: /packages/docs-site
    patterns: ["*"]
    multi-ecosystem-group: application-dependencies
    open-pull-requests-limit: 1

  - package-ecosystem: bun
    directory: /packages/plugin-host
    patterns: ["*"]
    multi-ecosystem-group: application-dependencies
    open-pull-requests-limit: 1

  - package-ecosystem: bun
    directory: /packages/plugin-sdk
    patterns: ["*"]
    multi-ecosystem-group: application-dependencies
    open-pull-requests-limit: 1

  - package-ecosystem: bun
    directory: /packages/tui
    patterns: ["*"]
    multi-ecosystem-group: application-dependencies
    open-pull-requests-limit: 1

  # END package inventory projection

  - package-ecosystem: pip
    directory: /scripts
    patterns: ["*"]
    multi-ecosystem-group: application-dependencies
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: automation-dependencies
    open-pull-requests-limit: 1
